plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load AdMob properties
def admobPropertiesFile = rootProject.file("admob.properties")
def admobProperties = new Properties()
if (admobPropertiesFile.exists()) {
    admobProperties.load(new FileInputStream(admobPropertiesFile))
} else {
    // Fallback to default values if file doesn't exist
    admobProperties['ADMOB_APP_ID'] = 'REPLACE_WITH_YOUR_ADMOB_APP_ID'
    admobProperties['ADMOB_BANNER_UNIT_ID'] = 'REPLACE_WITH_YOUR_BANNER_UNIT_ID'
    admobProperties['ADMOB_INTERSTITIAL_UNIT_ID'] = 'REPLACE_WITH_YOUR_INTERSTITIAL_UNIT_ID'
    admobProperties['ADS_ENABLED'] = 'true'
}

android {
    namespace 'com.example.crunchyrollwatcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.crunchyrollwatcher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Use Google's test AdMob IDs for debug builds
            buildConfigField "String", "ADMOB_APP_ID", "\"ca-app-pub-3940256099942544~3347511713\""
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_UNIT_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "boolean", "ADS_ENABLED", "true"
            buildConfigField "boolean", "IS_DEBUG_BUILD", "true"
            manifestPlaceholders = [ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use actual AdMob IDs from admob.properties for production
            buildConfigField "String", "ADMOB_APP_ID", "\"${admobProperties['ADMOB_APP_ID']}\""
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"${admobProperties['ADMOB_BANNER_UNIT_ID']}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_UNIT_ID", "\"${admobProperties['ADMOB_INTERSTITIAL_UNIT_ID']}\""
            buildConfigField "boolean", "ADS_ENABLED", "${admobProperties['ADS_ENABLED']}"
            buildConfigField "boolean", "IS_DEBUG_BUILD", "false"
            manifestPlaceholders = [ADMOB_APP_ID: admobProperties['ADMOB_APP_ID']]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'



    // Network requests
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // AdMob (Google Mobile Ads SDK)
    implementation 'com.google.android.gms:play-services-ads:22.5.0'

    // Guava for ListenableFuture (required by WorkManager)
    implementation 'com.google.guava:guava:31.1-android'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
